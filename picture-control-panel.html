<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Picture Control Panel v1</title>
  <style>
    :root {
      --bg: #0c1017;
      --panel: #151d2a;
      --panel-2: #1b2638;
      --line: #2b3750;
      --text: #e7edf8;
      --muted: #93a4c0;
      --accent: #63c9ff;
      --ok: #8fe48d;
      --warn: #ffd183;
      --danger: #ff8196;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      color: var(--text);
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
      background:
        radial-gradient(1200px 640px at 10% -30%, rgba(99, 201, 255, 0.12), transparent 62%),
        radial-gradient(1000px 480px at 95% -30%, rgba(143, 228, 141, 0.08), transparent 62%),
        #0c1017;
    }

    .wrap {
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }

    .card {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      padding: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.24rem;
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .section-title {
      margin: 0 0 8px;
      font-weight: 800;
      font-size: 0.94rem;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .row {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      color: #071018;
      background: var(--accent);
    }
    button.secondary { background: #dceaff; color: #0f1828; }
    button.ghost { background: #253349; color: var(--text); border: 1px solid var(--line); }

    textarea, pre {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0f1623;
      color: var(--text);
      padding: 8px 10px;
      outline: none;
      font-size: 0.88rem;
      line-height: 1.45;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    textarea { min-height: 240px; resize: vertical; }
    #outputJson { min-height: 360px; }

    .status {
      margin-top: 8px;
      min-height: 1.2em;
      color: var(--muted);
      font-size: 0.84rem;
    }
    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .status.error { color: var(--danger); }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .meta-cell {
      border: 1px solid var(--line);
      background: #0f1623;
      border-radius: 10px;
      padding: 8px;
      min-height: 48px;
    }

    .meta-key {
      color: var(--muted);
      font-size: 0.76rem;
    }

    .meta-val {
      margin-top: 4px;
      font-size: 0.9rem;
      word-break: break-word;
    }

    @media (max-width: 1200px) {
      .split { grid-template-columns: 1fr; }
      .meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Picture Control Panel v1</h1>
      <p class="sub">`picture-hook.json` と `picture-scene.json` を読み込み、統合した `picture.json` のみを編集・保存します（hook/sceneは参照専用）。</p>
      <div class="row">
        <button id="loadBothBtn">schemaの2ファイルを読み込み</button>
        <button id="pickHookBtn" class="ghost">hookファイル選択</button>
        <button id="pickSceneBtn" class="ghost">sceneファイル選択</button>
        <button id="loadSavedBtn" class="ghost">picture.json復元</button>
      </div>
      <div id="status" class="status"></div>
      <div class="meta-grid">
        <div class="meta-cell"><div class="meta-key">hook.version</div><div id="metaHookVersion" class="meta-val">-</div></div>
        <div class="meta-cell"><div class="meta-key">scene.version</div><div id="metaSceneVersion" class="meta-val">-</div></div>
        <div class="meta-cell"><div class="meta-key">scene count</div><div id="metaSceneCount" class="meta-val">-</div></div>
        <div class="meta-cell"><div class="meta-key">canvas</div><div id="metaCanvas" class="meta-val">-</div></div>
      </div>
    </section>

    <section class="split">
      <article class="card">
        <p class="section-title">Input Hook JSON（参照専用）</p>
        <textarea id="hookJson" placeholder="schema/picture-hook.json" readonly></textarea>
      </article>
      <article class="card">
        <p class="section-title">Input Scene JSON（参照専用）</p>
        <textarea id="sceneJson" placeholder="schema/picture-scene.json" readonly></textarea>
      </article>
    </section>

    <section class="card">
      <p class="section-title">Output picture.json（編集対象）</p>
      <div class="row">
        <button id="buildBtn">統合して生成</button>
        <button id="copyBtn" class="secondary">コピー</button>
        <button id="saveSchemaBtn" class="secondary">schema/picture.json に保存</button>
        <button id="downloadBtn" class="secondary">保存(フォールバック)</button>
        <button id="saveStateBtn" class="ghost">picture.jsonを一時保存</button>
      </div>
      <textarea id="outputJson"></textarea>
    </section>
  </main>

  <input id="hookFileInput" type="file" accept="application/json,.json" style="display:none" />
  <input id="sceneFileInput" type="file" accept="application/json,.json" style="display:none" />

  <script>
    (function () {
      "use strict";

      var HOOK_PATH = "schema/picture-hook.json";
      var SCENE_PATH = "schema/picture-scene.json";
      var OUTPUT_STATE_KEY = "svrs_picture_json";

      var el = {
        loadBothBtn: document.getElementById("loadBothBtn"),
        pickHookBtn: document.getElementById("pickHookBtn"),
        pickSceneBtn: document.getElementById("pickSceneBtn"),
        loadSavedBtn: document.getElementById("loadSavedBtn"),
        buildBtn: document.getElementById("buildBtn"),
        copyBtn: document.getElementById("copyBtn"),
        saveSchemaBtn: document.getElementById("saveSchemaBtn"),
        downloadBtn: document.getElementById("downloadBtn"),
        saveStateBtn: document.getElementById("saveStateBtn"),
        hookJson: document.getElementById("hookJson"),
        sceneJson: document.getElementById("sceneJson"),
        outputJson: document.getElementById("outputJson"),
        status: document.getElementById("status"),
        metaHookVersion: document.getElementById("metaHookVersion"),
        metaSceneVersion: document.getElementById("metaSceneVersion"),
        metaSceneCount: document.getElementById("metaSceneCount"),
        metaCanvas: document.getElementById("metaCanvas"),
        hookFileInput: document.getElementById("hookFileInput"),
        sceneFileInput: document.getElementById("sceneFileInput")
      };

      function setStatus(text, mode) {
        el.status.textContent = text;
        el.status.className = "status" + (mode ? " " + mode : "");
      }

      function normalizeJsonText(raw) {
        var text = String(raw == null ? "" : raw);
        if (text.charCodeAt(0) === 0xFEFF) {
          text = text.slice(1);
        }
        var fenced = text.match(/^\s*```(?:json)?\s*([\s\S]*?)\s*```\s*$/i);
        if (fenced) {
          text = fenced[1];
        }
        return text.trim();
      }

      function parseJson(raw) {
        try {
          return JSON.parse(normalizeJsonText(raw));
        } catch (_err) {
          return null;
        }
      }

      function normalizeNumber(value, fallback) {
        var n = Number(value);
        return Number.isFinite(n) ? n : fallback;
      }

      function stringify(value) {
        return JSON.stringify(value, null, 2);
      }

      function updateMetaView(hookObj, sceneObj, mergedObj) {
        var hookVersion = hookObj && hookObj.meta ? String(hookObj.meta.version || "-") : "-";
        var sceneVersion = sceneObj && sceneObj.meta ? String(sceneObj.meta.version || "-") : "-";
        var count = sceneObj && Array.isArray(sceneObj.scenes) ? sceneObj.scenes.length : 0;
        var canvas = mergedObj && mergedObj.canvas
          ? String(mergedObj.canvas.width) + "x" + String(mergedObj.canvas.height)
          : "-";

        el.metaHookVersion.textContent = hookVersion;
        el.metaSceneVersion.textContent = sceneVersion;
        el.metaSceneCount.textContent = String(count);
        el.metaCanvas.textContent = canvas;
      }

      function normalizeCanvas(hookObj, sceneObj) {
        var hookCanvas = hookObj && hookObj.canvas ? hookObj.canvas : {};
        var sceneCanvas = sceneObj && sceneObj.canvas ? sceneObj.canvas : {};
        var width = normalizeNumber(hookCanvas.width, normalizeNumber(sceneCanvas.width, 1080));
        var height = normalizeNumber(hookCanvas.height, normalizeNumber(sceneCanvas.height, 1920));
        var format = typeof hookCanvas.format === "string" && hookCanvas.format.trim()
          ? hookCanvas.format.trim()
          : "vertical_9_16";
        var aspect = typeof sceneCanvas.aspect_ratio === "string" && sceneCanvas.aspect_ratio.trim()
          ? sceneCanvas.aspect_ratio.trim()
          : "9:16";
        return {
          width: width,
          height: height,
          format: format,
          aspect_ratio: aspect
        };
      }

      function validateHook(hookObj) {
        if (!hookObj || typeof hookObj !== "object") return "hook JSON がobjectではありません";
        if (!hookObj.texts || typeof hookObj.texts !== "object") return "hook.texts が必要です";
        if (!hookObj.background || typeof hookObj.background !== "object") return "hook.background が必要です";
        return "";
      }

      function validateScene(sceneObj) {
        if (!sceneObj || typeof sceneObj !== "object") return "scene JSON がobjectではありません";
        if (!Array.isArray(sceneObj.scenes)) return "scene.scenes が配列ではありません";
        if (!sceneObj.scenes.length) return "scene.scenes が空です";
        return "";
      }

      function buildPictureJson(hookObj, sceneObj) {
        return {
          meta: {
            version: "picture_json_v1",
            created_at: new Date().toISOString(),
            created_by: "picture-control-panel.html",
            sources: {
              hook: HOOK_PATH,
              scene: SCENE_PATH
            }
          },
          canvas: normalizeCanvas(hookObj, sceneObj),
          hook: hookObj,
          scene: sceneObj
        };
      }

      async function readJsonByFetch(path) {
        var response = await fetch(path, { cache: "no-store" });
        if (!response.ok) throw new Error(path + " の取得に失敗しました: " + response.status);
        return await response.text();
      }

      function readFileAsText(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () { resolve(String(reader.result || "")); };
          reader.onerror = function () { reject(new Error("file read failed")); };
          reader.readAsText(file);
        });
      }

      async function pickJsonFileByInput(inputEl) {
        return new Promise(function (resolve) {
          var done = false;
          var onChange = function () {
            if (done) return;
            done = true;
            inputEl.removeEventListener("change", onChange);
            var file = inputEl.files && inputEl.files[0] ? inputEl.files[0] : null;
            inputEl.value = "";
            resolve(file);
          };
          inputEl.addEventListener("change", onChange);
          inputEl.click();
        });
      }

      async function pickJsonFileByPicker() {
        if (typeof window.showOpenFilePicker !== "function") return null;
        var handles = await window.showOpenFilePicker({
          multiple: false,
          types: [
            {
              description: "JSON file",
              accept: { "application/json": [".json"] }
            }
          ]
        });
        if (!handles || !handles.length) return null;
        return await handles[0].getFile();
      }

      async function pickAndLoadJson(kind) {
        var target = kind === "hook" ? el.hookJson : el.sceneJson;
        var inputEl = kind === "hook" ? el.hookFileInput : el.sceneFileInput;
        var label = kind === "hook" ? "hook" : "scene";
        try {
          var file = null;
          if (typeof window.showOpenFilePicker === "function") {
            try {
              file = await pickJsonFileByPicker();
            } catch (pickerErr) {
              if (!pickerErr || pickerErr.name !== "AbortError") throw pickerErr;
              setStatus(label + " ファイル選択をキャンセルしました。", "warn");
              return false;
            }
          } else {
            file = await pickJsonFileByInput(inputEl);
          }
          if (!file) {
            setStatus(label + " ファイルが選択されていません。", "warn");
            return false;
          }
          var raw = await readFileAsText(file);
          var parsed = parseJson(raw);
          if (!parsed) {
            setStatus(label + " JSON の形式が不正です。", "error");
            return false;
          }
          target.value = stringify(parsed);
          setStatus(label + " ファイルを読み込みました: " + file.name, "ok");
          return true;
        } catch (err) {
          setStatus(label + " ファイル読込失敗: " + (err && err.message ? err.message : String(err)), "error");
          return false;
        }
      }

      function triggerDownload(fileName, content) {
        var blob = new Blob([content], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      async function savePictureJsonToSchema(content) {
        if (typeof window.showDirectoryPicker !== "function") {
          throw new Error("File System Access API が使えません");
        }
        var root = await window.showDirectoryPicker({ mode: "readwrite" });
        var schemaDir = await root.getDirectoryHandle("schema", { create: true });
        var fileHandle = await schemaDir.getFileHandle("picture.json", { create: true });
        var writable = await fileHandle.createWritable();
        await writable.write(content);
        await writable.close();
      }

      function rebuildOutput() {
        var hookObj = parseJson(el.hookJson.value);
        var sceneObj = parseJson(el.sceneJson.value);
        if (!hookObj) {
          setStatus("hook JSON の形式が不正です。", "error");
          return;
        }
        if (!sceneObj) {
          setStatus("scene JSON の形式が不正です。", "error");
          return;
        }
        var hookErr = validateHook(hookObj);
        if (hookErr) {
          setStatus(hookErr, "error");
          return;
        }
        var sceneErr = validateScene(sceneObj);
        if (sceneErr) {
          setStatus(sceneErr, "error");
          return;
        }

        var merged = buildPictureJson(hookObj, sceneObj);
        el.outputJson.value = stringify(merged);
        localStorage.setItem(OUTPUT_STATE_KEY, el.outputJson.value);
        updateMetaView(hookObj, sceneObj, merged);
        setStatus("picture.json を生成しました。", "ok");
      }

      async function loadHook() {
        try {
          var raw = await readJsonByFetch(HOOK_PATH);
          var parsed = parseJson(raw);
          if (!parsed) throw new Error("JSON parse failed");
          el.hookJson.value = stringify(parsed);
          setStatus("picture-hook.json を読み込みました。", "ok");
          return true;
        } catch (err) {
          setStatus("picture-hook.json 読み込み失敗: " + (err && err.message ? err.message : String(err)), "error");
          return false;
        }
      }

      async function loadScene() {
        try {
          var raw = await readJsonByFetch(SCENE_PATH);
          var parsed = parseJson(raw);
          if (!parsed) throw new Error("JSON parse failed");
          el.sceneJson.value = stringify(parsed);
          setStatus("picture-scene.json を読み込みました。", "ok");
          return true;
        } catch (err) {
          setStatus("picture-scene.json 読み込み失敗: " + (err && err.message ? err.message : String(err)), "error");
          return false;
        }
      }

      async function loadBoth() {
        setStatus("2ファイルを読み込み中...", "warn");
        var results = await Promise.all([loadHook(), loadScene()]);
        if (!results[0] || !results[1]) {
          setStatus("2ファイルの fetch 読み込みに失敗しました。`file://` 直開きなら「hook/sceneファイル選択」を使ってください。", "error");
          return;
        }
        rebuildOutput();
      }

      function loadSaved() {
        var out = localStorage.getItem(OUTPUT_STATE_KEY);
        if (out) el.outputJson.value = out;

        if (!out) {
          setStatus("保存済み picture.json が見つかりません。", "warn");
          return;
        }
        var parsed = parseJson(out);
        if (parsed && typeof parsed === "object") {
          updateMetaView(parsed.hook || null, parsed.scene || null, parsed);
        }
        setStatus("保存済み picture.json を復元しました。", "ok");
      }

      function saveState() {
        localStorage.setItem(OUTPUT_STATE_KEY, el.outputJson.value || "");
        setStatus("picture.json を一時保存しました。", "ok");
      }

      async function copyOutput() {
        var text = String(el.outputJson.value || "").trim();
        if (!text) {
          setStatus("先に統合JSONを生成してください。", "warn");
          return;
        }
        try {
          await navigator.clipboard.writeText(text);
          setStatus("統合 picture.json をコピーしました。", "ok");
        } catch (_err) {
          setStatus("コピーに失敗しました。", "error");
        }
      }

      function downloadOutput() {
        var text = String(el.outputJson.value || "").trim();
        if (!text) {
          setStatus("保存対象の picture.json が空です。", "warn");
          return;
        }
        var parsed = parseJson(text);
        if (!parsed) {
          setStatus("picture.json の形式が不正です。", "error");
          return;
        }
        triggerDownload("picture.json", stringify(parsed) + "\n");
        setStatus("picture.json をダウンロード保存しました。", "ok");
      }

      async function saveSchemaOutput() {
        var text = String(el.outputJson.value || "").trim();
        if (!text) {
          setStatus("保存対象の picture.json が空です。", "warn");
          return;
        }
        var parsed = parseJson(text);
        if (!parsed) {
          setStatus("picture.json の形式が不正です。", "error");
          return;
        }
        var normalized = stringify(parsed) + "\n";
        try {
          await savePictureJsonToSchema(normalized);
          localStorage.setItem(OUTPUT_STATE_KEY, normalized);
          setStatus("schema/picture.json に保存しました。", "ok");
        } catch (err) {
          var msg = err && err.name === "AbortError"
            ? "保存をキャンセルしました。"
            : "schema への保存に失敗したため、ダウンロードにフォールバックします。";
          if (msg.indexOf("フォールバック") >= 0) {
            triggerDownload("picture.json", normalized);
          }
          setStatus(msg, err && err.name === "AbortError" ? "warn" : "warn");
        }
      }

      el.pickHookBtn.addEventListener("click", function () {
        pickAndLoadJson("hook").then(function (ok) {
          if (ok) rebuildOutput();
        });
      });
      el.pickSceneBtn.addEventListener("click", function () {
        pickAndLoadJson("scene").then(function (ok) {
          if (ok) rebuildOutput();
        });
      });
      el.loadBothBtn.addEventListener("click", loadBoth);
      el.loadSavedBtn.addEventListener("click", loadSaved);
      el.buildBtn.addEventListener("click", rebuildOutput);
      el.copyBtn.addEventListener("click", copyOutput);
      el.saveSchemaBtn.addEventListener("click", saveSchemaOutput);
      el.downloadBtn.addEventListener("click", downloadOutput);
      el.saveStateBtn.addEventListener("click", saveState);

      el.outputJson.addEventListener("input", function () {
        localStorage.setItem(OUTPUT_STATE_KEY, el.outputJson.value || "");
      });

      loadBoth();
    })();
  </script>
</body>
</html>
