<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tool2 フック画像生成プロンプトビルダー</title>
  <style>
    :root {
      --bg-a: #081119;
      --bg-b: #102236;
      --bg-c: #1a3a44;
      --panel: rgba(8, 20, 30, 0.84);
      --panel-2: rgba(12, 31, 42, 0.82);
      --surface: rgba(8, 20, 30, 0.9);
      --line: rgba(99, 217, 188, 0.36);
      --line-soft: rgba(168, 196, 194, 0.25);
      --ink: #f2f8f7;
      --sub: #a8c4c2;
      --accent: #63d9bc;
      --ok: #93f5c7;
      --danger: #ff8f8f;
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
      --radius: 16px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background:
        radial-gradient(140% 120% at 0% 0%, rgba(99, 217, 188, 0.2) 0%, rgba(99, 217, 188, 0) 44%),
        radial-gradient(120% 120% at 100% 0%, rgba(255, 202, 118, 0.1) 0%, rgba(255, 202, 118, 0) 46%),
        linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 45%, var(--bg-c) 100%);
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(99, 217, 188, 0.28);
      background: linear-gradient(90deg, #0d3f39 0%, #0c3140 35%, #102236 70%, #081119 100%);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
    }

    .topbar {
      min-height: 66px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
    }

    .topbarLeft {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 14px;
      flex: 1;
    }

    .brandMark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #1f7f6c, #124c58);
      border: 1px solid rgba(147, 245, 199, 0.36);
      box-shadow: 0 8px 20px rgba(8, 20, 30, 0.45);
      color: #f2fff9;
      font-size: 16px;
      line-height: 1;
      font-weight: 800;
    }

    .brandText {
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
    }

    .topbarDivider {
      width: 1px;
      height: 28px;
      background: rgba(168, 196, 194, 0.42);
      flex: none;
    }

    .topbarTitle {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .topbarVersion {
      font-size: 12px;
      font-weight: 800;
      color: var(--ok);
      letter-spacing: 0.04em;
      opacity: 0.9;
      white-space: nowrap;
    }

    main {
      padding: 20px 16px 30px;
    }

    .wrap {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .card {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.8vw, 2rem);
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--sub);
      line-height: 1.55;
    }

    .hero {
      display: grid;
      gap: 10px;
    }

    .section {
      margin: 0 0 8px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: 0.82rem;
      font-weight: 800;
    }

    label {
      display: block;
      color: #d8ece8;
      font-size: 0.88rem;
      font-weight: bold;
      margin: 0 0 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid rgba(168, 196, 194, 0.35);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      padding: 12px;
      font-size: 0.92rem;
      outline: none;
      box-shadow: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 217, 188, 0.18);
    }

    select {
      min-height: 45px;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--accent) 50%),
        linear-gradient(135deg, var(--accent) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 19px,
        calc(100% - 12px) 19px;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 34px;
    }

    textarea {
      min-height: 260px;
      resize: vertical;
      line-height: 1.55;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Yu Gothic UI", monospace;
      white-space: pre-wrap;
    }

    button {
      min-height: 40px;
      padding: 10px 14px;
      font-size: 0.86rem;
      font-weight: bold;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #98f2dd);
      color: #06241e;
      transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      color: #d8ece8;
      border: 1px solid rgba(168, 196, 194, 0.34);
      background: rgba(8, 20, 30, 0.75);
    }

    textarea[readonly] {
      background: rgba(8, 20, 30, 0.66);
      border-style: dashed;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .settingsRow {
      display: grid;
      grid-template-columns: minmax(180px, 260px);
      gap: 12px;
    }

    .field {
      min-width: 0;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: stretch;
    }

    .panel {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }

    @media (max-width: 700px) {
      .row,
      .settingsRow,
      .workspace {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .topbarLeft {
        width: 100%;
      }

      .brandText,
      .topbarDivider {
        display: none;
      }

      .topbarTitle {
        white-space: normal;
      }

      button {
        width: 100%;
      }

      .actions {
        justify-content: stretch;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="topbarLeft">
        <div class="brandMark">ZSM</div>
        <div class="brandText">ずんだもん ショート動画作成</div>
        <div class="topbarDivider"></div>
        <div class="topbarTitle">Hook Picture Prompt Builder</div>
      </div>
      <div class="topbarVersion">TOOL2</div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="card hero">
        <h1>tool2:HOOK背景画像プロンプト生成</h1>
        <p>MAIN / MID / SUB の3行テキストだけで、YouTube Shorts冒頭0〜2秒向けの淡い背景色HOOK画像プロンプトを生成します。</p>
      </section>

      <section class="card panel">
        <p class="section">HOOK Text</p>
        <div class="row">
          <div class="field">
            <label for="main">MAIN</label>
            <input id="main" placeholder="寝てないアピール!?" />
          </div>

          <div class="field">
            <label for="mid">MID</label>
            <input id="mid" placeholder="予防線張る脳内" />
          </div>

          <div class="field">
            <label for="sub">SUB</label>
            <input id="sub" placeholder="ってだいたいこれ" value="ってだいたいこれ" />
          </div>
        </div>

        <div class="settingsRow">
          <div class="field">
            <label for="backgroundColor">背景カラーパターン</label>
            <select id="backgroundColor">
              <option value="#F3FFE2">#F3FFE2（淡い若草）</option>
              <option value="#fff5f5">#fff5f5（淡い桜）</option>
              <option value="#fff5EE">#fff5EE（淡いピーチ）</option>
              <option value="#eaf6ff">#eaf6ff（淡い空色）</option>
            </select>
          </div>
        </div>
      </section>

      <section class="workspace">
        <div class="card panel">
          <div>
            <p class="section">Output Prompt</p>
            <label for="output">生成プロンプト</label>
          </div>
          <textarea id="output" readonly spellcheck="false" placeholder="ここに生成プロンプトが出ます。"></textarea>
          <div class="actions">
            <button id="generate" type="button">プロンプト生成</button>
            <button id="copy" class="secondary" type="button">コピー</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function buildPrompt() {
      const main = $("main").value.trim();
      const mid = $("mid").value.trim();
      const sub = $("sub").value.trim();
      const backgroundColor = $("backgroundColor").value;

      if (!main || !mid || !sub) {
        alert("MAIN / MID / SUB は全部入れてクレメンス");
        return "";
      }

      return `YouTube Shorts冒頭0〜2秒用のHOOK背景画像を生成してください。

画像サイズ：
1080x1920px
縦長9:16
スマホ視聴向け

目的：
YouTube Shortsの一覧や動画冒頭で、視聴者に「おっ、解説動画か？」と思わせる入口画像。
淡い背景色と大きな文字だけで成立する、講義スライド風・解説動画風のHOOK背景を作る。
キャラクターや後工程の素材を載せる前の、テキスト専用背景として生成する。

最重要原則：
- 生成する要素は淡い単色背景とフックテキストのみ
- キャラクター、人物、吹き出し、小物、背景シーンは一切入れない
- MAINのみ赤文字
- MAINは最上段に配置し、最初に視認される最重要ワードとして扱う
- MIDとSUBは、標準の黒よりRGBを各10程度落とした落ち着いた黒系カラーにする
- MIDはMAINの意味を補足する中サイズ文字として扱う
- SUBはシリーズ認識用の小サイズ文字として扱う
- スマホ一覧で一瞬見てもMAINが最初に読めることを最優先する
- 情報量を増やさず、文字組み、余白、軽いタイポグラフィだけで品質を上げる

重要：
以下の3つの日本語テキストだけを、必ず画像内に入れてください。
文言の改変、省略、追加、言い換えは禁止です。
オチ、説明文、補足コピー、英語テキスト、ロゴ、注釈は追加しないでください。

MAIN：
「${main}」

MID：
「${mid}」

SUB：
「${sub}」

基本レイアウト：
- 上部〜中央エリアの最上段にMAINを配置
- MAINの下にMIDを配置
- MIDの下にSUBを配置
- レイアウト順は必ず MAIN → MID → SUB にする
- 3行は上部〜中央エリアにコンパクトに配置する
- MAINとMIDは左揃えで配置する
- SUBは右寄せしすぎず、MIDの右端に軽く揃える程度に配置する
- MAINとMIDの左端を揃え、SUBはMIDの右端を基準に控えめに右揃えする
- MAINとMIDの行間は狭めにし、1つの強い見出しまとまりとして見せる
- MIDとSUBの行間は現在の余白感を維持し、過度に広げたり詰めたりしない
- 中央揃えにはしない
- 画面下40%は完全な余白として確保する
- 下部40%には文字、装飾、図形、影、線、アイコンを配置しない
- 下部40%は後工程でキャラクターを追加するための空白スペースにする

文字スタイル：
- MAIN：赤文字、最も大きい、最初に目に入る太字
- MID：標準の黒よりRGBを各10程度落とした黒系カラー、MAINの下に置く中サイズのミディアム
- SUB：標準の黒よりRGBを各10程度落とした黒系カラー、MIDの下に置く中サイズのノーマル
- MAINを基準サイズ（1.0）とする
- MIDのサイズはMAINの0.68〜0.8倍程度にする
- SUBのサイズはMIDと等倍にする
- MAIN基準で見る場合、SUBのサイズはMIDと同じくMAINの0.68〜0.8倍程度にする
- スマホ一覧でも「ってだいたいこれ」が読めるサイズにする
- MAINのみ明確に強調し、刺さるワードとして最上段で読ませる
- MAIN / MID / SUBは3行で1つのタイトルとして読めるサイズバランスにする
- YouTubeサムネイル風の過剰な装飾を避ける
- 講義スライドのタイトルデザインとして自然な比率にする
- MAIN / MID / SUB の3行を一体のタイトルとして扱う
- MAINの横幅は画面幅の70%以内
- MAINの文字高は画面高の15%以内
- MAINを画面中央いっぱいに拡大しない
- タイトル全体を上部〜中央エリア内にコンパクトに収める
- MAINが長い場合は無理に大きくせず、改行またはサイズ調整で余白を守る
- MAINは太すぎる極太文字にせず、上品で読みやすいセミボールド〜ボールド程度にする
- MAINは画面幅いっぱいまで広げすぎず、左右に十分な余白を残す
- MAINの高さは上部〜中央エリアの中で自然に収まるサイズにし、巨大なサムネ文字にしない
- すべて読みやすいヒラギノ系のゴシック体
- 文字は正確に読み取れるように、潰れや崩れを避ける
- 文字組み、改行、行間、余白で品質を出す
- 影や縁取りを使う場合は極めて薄く、可読性補助の範囲に留める

背景：
- 背景色は ${backgroundColor} として統一する
- 背景シーン、場所、室内、風景、模様、写真風背景は入れない
- 紙のスライドや解説動画の入口のように、清潔で余白のある見た目にする

禁止事項：
- テキスト以外の要素を追加しない
- キャラクター、人物、顔、手、シルエットを入れない
- 吹き出しを入れない
- 小物、アイコン、ロゴ、矢印、丸、四角、線、図形を入れない
- 背景シーンや状況説明を描写しない
- MAIN / MID / SUB 以外の文字を追加しない
- 入力文言を改変しない
- オチや説明を補足しない
- 派手なYouTubeサムネ風装飾、集中線、爆発、炎、グラデーション文字、過度な発光を使わない

完成イメージ：
 ${backgroundColor}背景に、最上段から赤く大きいMAIN、落ち着いた黒系カラーの中サイズMID、落ち着いた黒系カラーの中サイズSUBだけが配置されたシンプルな縦型解説スライド。
視聴者がスマホ一覧で一瞬見た時、MAINが最初に読める。
フック文言そのものが主役で、下部40%は完全に空いている。`;
    }

    $("generate").addEventListener("click", () => {
      $("output").value = buildPrompt();
    });

    $("copy").addEventListener("click", async () => {
      const text = $("output").value;
      if (!text) return;

      await navigator.clipboard.writeText(text);
      alert("コピーしました！");
    });
  </script>
</body>
</html>
